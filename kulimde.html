<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Күлімдеші!</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ffe6f2; /* Soft pink background */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center; 
            padding: 20px;
        }
        h1 { 
            color: #ff4d94; 
            font-size: 28px;
        }
        #message-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(255, 77, 148, 0.15);
            max-width: 400px;
            margin-bottom: 20px;
        }
        #message { 
            font-size: 22px; 
            color: #cc0052; 
            min-height: 80px; 
            font-weight: bold; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button { 
            background-color: #ff80b3; 
            border: none; 
            color: white; 
            padding: 15px 35px; 
            font-size: 18px; 
            font-weight: bold;
            border-radius: 30px; 
            cursor: pointer; 
            transition: 0.3s; 
            box-shadow: 0 5px 15px rgba(255, 128, 179, 0.4); 
        }
        button:hover { 
            background-color: #ff4d94; 
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Емтихан – жай ғана тест, ал сен – суперсің! 🌟</h1>
    
    <div id="message-box">
        <div id="message">Сен үшін арнайы хабарлама... (Кнопканы бас!)</div>
    </div>

    <button onclick="showMessage()">Маған бас! 💖</button>

    <script>
        // Fun, encouraging texts in Kazakh
        const messages = [
            "Мұңайма! Сен бәрібір ең мықтысың! 💪",
            "УБТ деген жай ғана Емтихан, ал сенің ақылың одан да зор! 🧠✨",
            "Күлімдеші! Сенің күлкің өте әдемі! 😊",
            "Бұл балл сенің қаншалықты керемет екеніңді көрсетпейді! 🌸",
            "Мен әрқашан сенімен біргемін 🤗",
            "Бәрі жақсы болады! Сенің қолыңнан келеді 🚀",
            "Сен бұдан да қиын нәрселерді жеңгенсің! Тек алға! 💫",
            "Өзіңді баға үшін ренжітпе, сен маған өте қымбатсың! ❤️"
        ];

        function showMessage() {
            // Get a random message from the list
            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById('message').innerText = messages[randomIndex];
        }
    </script>

</body>
</html>
